# keyd: Mac-style tab switching on the Cmd-position key.
#
# Layering note: keyd runs at the evdev level, BEFORE niri applies
# altwin:swap_alt_win. So the key next to the spacebar is still
# "leftalt" here, even though niri later presents it as Super/Mod.
#
# Everything not listed below passes through untouched.

[ids]
*

[alt]
left  = C-pageup
right = C-pagedown
